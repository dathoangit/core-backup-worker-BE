services:
  backup-api:
    build: .
    image: core-backup-worker:latest
    container_name: core-backup-api
    restart: unless-stopped
    command: ['node', 'dist/main.js']
    env_file:
      # Infrastructure only (DB, Redis, JWT, SETTINGS_SECRET_KEY). See .env.production.example.
      - .env
    environment:
      # First boot seeds app_settings from this file (encrypts *_PASSWORD). Optional after seed.
      SETTINGS_SEED_FILE: /app/.env.settings
    ports:
      - '${HOST_PORT:-3000}:3000'
    volumes:
      # Long-term backup data lives on the 10.9 TB disk (/dev/sdb), never on the OS disk.
      - /mnt/5AE4E9F5E4E9D375/backup-storage:/app/backup-storage
      # Host timezone so local Date output matches Asia/Ho_Chi_Minh.
      # Cron itself uses BACKUP_TIMEZONE and does not depend on this mount.
      - /etc/localtime:/etc/localtime:ro
      # Copy from .env.settings.example, fill passwords, then docker compose up.
      - ./.env.settings:/app/.env.settings:ro
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    # Liveness only. GET /health returns 503 when backup freshness is stale and
    # must not restart the container.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  backup-worker:
    build: .
    image: core-backup-worker:latest
    container_name: core-backup-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file:
      - .env
    environment:
      SETTINGS_SEED_FILE: /app/.env.settings
    volumes:
      - /mnt/5AE4E9F5E4E9D375/backup-storage:/app/backup-storage
      - /etc/localtime:/etc/localtime:ro
      - ./.env.settings:/app/.env.settings:ro
    networks:
      - backend
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "node dist/worker.js" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

networks:
  backend:
    external: true
    name: docker-env_backend
